<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORA X - منشئ مواقع شغال بجد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#FF0A0A}
*{box-sizing:border-box} body{margin:0;background:#fff;color:#0a0a0a;font-family:'Tajawal',sans-serif}
header{position:sticky;top:0;display:flex;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:4px solid #000}
button{font:inherit;font-weight:700;border:3px solid #000;background:#fff;padding:10px 18px;cursor:pointer}
button.p{background:var(--red);color:#fff;box-shadow:6px 6px 0 #000}
textarea,input{width:100%;background:#f5f5f5;border:3px solid #000;padding:14px;font:inherit}
#prev{display:none;margin-top:16px;border:4px solid #000;box-shadow:10px 10px 0 #000}
.topbar{display:flex;justify-content:space-between;padding:10px;background:#000;color:#fff}
.topbar button{border-color:#fff;background:#000;color:#fff;font-size:12px}
.topbar button.on{background:#fff;color:#000}
iframe{width:100%;height:65vh;border:0}
.linkbox{display:none;margin-top:16px;border:4px solid var(--red);background:#fff0f0;padding:14px}
.linkbox a{color:var(--red);font-weight:900;word-break:break-all}
.saved-item{display:flex;justify-content:space-between;border:2px solid #000;padding:10px;margin-bottom:8px;background:#fff}
</style>
</head>
<body>
<header><div style="font-weight:900">OMAR <span style="color:#FF0A0A">MORA X</span></div><div style="font-size:11px;font-weight:700">V2 شغال بجد - يحفظ تلقائيا</div></header>
<section style="max-width:1000px;margin:auto;padding:24px 16px">
<h1 style="font-size:clamp(28px,7vw,50px);line-height:1.1;font-weight:900"><span style="color:#FF0A0A">اوصف فكرتك.</span> هنبني موقع شغال برابط جوجل.</h1>
<textarea id="idea" placeholder="مثال: موقع العاب اسود واحمر اسمه MORA X GAMES فيه 6 العاب - او مطعم برجر في شربين"></textarea>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0">
<button onclick="setIdea('موقع العاب اسود واحمر اسمه MORA X GAMES فيه 6 العاب')">🎮 موقع العاب</button>
<button onclick="setIdea('مطعم برجر في شربين دقهلية مع منيو واسعار')">🍔 مطعم</button>
<button onclick="setIdea('كافيه في القاهرة')">☕ كافيه</button>
</div>
<div style="display:flex;gap:10px"><button class="p" onclick="build()">▶ ابن موقعي حالاً</button><button onclick="clearAll()">🗑️ مسح</button></div>
<div id="status" style="margin:12px 0;font-weight:900;color:#FF0A0A"></div>
<div id="prev"><div class="topbar"><div><button id="dsk" class="on" onclick="setMode('desk')">💻 كمبيوتر</button><button id="mob" onclick="setMode('mob')">📱 موبايل</button></div><div><button onclick="copyCode()">📋 نسخ الكود</button><button onclick="editCode()">✏️ تعديل</button></div></div><iframe id="frame"></iframe><div style="padding:12px;border-top:3px solid #000;display:flex;gap:8px"><input id="tweak" placeholder="عايز تعدل ايه؟ مثلا: خليه احمر" style="flex:1"><button class="p" onclick="tweakSite()">عدّل</button></div></div>
<div class="linkbox" id="linkbox"><div style="font-weight:900">🔗 رابط موقعك المباشر (يفتح في جوجل):</div><a id="liveLink" href="#" target="_blank"></a><div style="display:flex;gap:8px;margin-top:10px"><button class="p" onclick="copyLink()">📋 نسخ الرابط</button><button onclick="download()">⬇ تحميل</button><button onclick="window.open('https://app.netlify.com/drop','_blank')">🚀 نشر دائم</button></div></div>
<h3 style="margin-top:30px">📁 مواقعك المحفوظة (حتى لو قفلت):</h3><div id="savedList"></div>
</section>
<script>
let currentHTML='',currentURL='',history=JSON.parse(localStorage.getItem('mora_x_v2')||'[]');
function setIdea(t){document.getElementById('idea').value=t;}
function saveHistory(idea,html){history.unshift({idea,html,date:new Date().toLocaleString('ar-EG'),id:Date.now()});if(history.length>20)history.pop();localStorage.setItem('mora_x_v2',JSON.stringify(history));localStorage.setItem('mora_x_last',JSON.stringify({idea,html}));renderHistory();}
function renderHistory(){const box=document.getElementById('savedList');if(!history.length){box.innerHTML='<p>لسه مفيش مواقع</p>';return;}box.innerHTML=history.map(h=>`<div class="saved-item"><div><b>${h.idea.slice(0,35)}</b><br><small>${h.date}</small></div><div><button onclick="loadItem(${h.id})">فتح</button> <button onclick="delItem(${h.id})">حذف</button></div></div>`).join('');}
function loadItem(id){const item=history.find(x=>x.id===id);if(item){document.getElementById('idea').value=item.idea;showPreview(item.html);}}
function delItem(id){history=history.filter(x=>x.id!==id);localStorage.setItem('mora_x_v2',JSON.stringify(history));renderHistory();}
function clearAll(){if(confirm('تمسح الكل؟')){history=[];localStorage.clear();renderHistory();document.getElementById('prev').style.display='none';document.getElementById('linkbox').style.display='none';}}
function generateLocalSite(idea){const lower=idea.toLowerCase();const isGame=lower.includes('لعاب')||lower.includes('game');const isFood=lower.includes('مطعم')||lower.includes('برجر')||lower.includes('كافيه');const title=idea.slice(0,25)||'MORA X';if(isGame){return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>${title}</title><style>body{margin:0;background:#080808;color:#fff;font-family:sans-serif}header{padding:16px;border-bottom:3px solid #fff;display:flex;justify-content:space-between}.a{background:#fff;color:#000;padding:2px 8px}.b{background:#FF0A0A;color:#fff;padding:2px 8px}.hero{padding:50px 20px;font-size:8vw;font-weight:900}.hero span{color:#FF0A0A}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:20px}.card{border:3px solid #fff;padding:16px;background:#111}.play{background:#fff;color:#000;padding:8px 12px;display:inline-block;margin-top:10px;text-decoration:none;font-weight:900}</style></head><body><header><div style="display:flex;gap:6px;font-weight:900"><div class="a">OMAR</div><div class="b">MORA</div><div style="background:#FF0A0A;padding:2px 6px">X</div></div><div>GAMES V2</div></header><div class="hero">PLAY<br><span>HARD.</span><br>${title}</div><div class="grid"><div class="card"><h2>SHADOW STRIKE X</h2><p>اكشن ★4.9</p><a class="play" href="#">العب →</a></div><div class="card"><h2>NITRO DRIFT</h2><p>سباق ★4.8</p><a class="play" href="#">العب →</a></div><div class="card"><h2>${title}</h2><p>لعبة جديدة</p><a class="play" href="#">العب →</a></div></div></body></html>`;}if(isFood){return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>${title}</title><style>body{margin:0;font-family:sans-serif;background:#fff8f0}header{padding:16px;background:#000;color:#fff;display:flex;justify-content:space-between}.hero{background:#FF0A0A;color:#fff;padding:50px;text-align:center}.hero h1{font-size:10vw;margin:0}.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:20px}.item{border:4px solid #000;padding:14px;background:#fff;box-shadow:6px 6px 0 #000}.btn{background:#000;color:#fff;padding:8px;display:inline-block;margin-top:8px}</style></head><body><header><b>${title}</b><span>شربين - دقهلية</span></header><div class="hero"><h1>${title}</h1><p>احلى اكل</p></div><div class="menu"><div class="item"><h3>برجر دبل X</h3><b>120 جنيه</b><div class="btn">اطلب</div></div><div class="item"><h3>بطاطس MORA</h3><b>45 جنيه</b><div class="btn">اطلب</div></div><div class="item"><h3>كومبو</h3><b>250 جنيه</b><div class="btn">اطلب</div></div></div></body></html>`;}return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>${title}</title><style>body{margin:0;font-family:sans-serif;background:#f5f5f3}header{padding:16px;background:#fff;border-bottom:4px solid #000;display:flex;justify-content:space-between}.hero{padding:60px 20px;background:#111;color:#fff}.hero h1{font-size:9vw;margin:0}.btn{background:#FF0A0A;color:#fff;padding:12px 20px;display:inline-block;margin-top:14px;text-decoration:none;font-weight:900;border:3px solid #000;box-shadow:4px 4px 0 #000}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:20px}.card{background:#fff;border:3px solid #000;padding:16px;box-shadow:4px 4px 0 #000}</style></head><body><header><b>MORA X</b><span>${title}</span></header><div class="hero"><h1>${title}</h1><p>${idea}</p><a class="btn" href="#">تواصل</a></div><div class="grid"><div class="card"><h3>خدمة 1</h3><p>افضل جودة</p></div><div class="card"><h3>خدمة 2</h3><p>توصيل سريع</p></div></div></body></html>`;}
function showPreview(html){currentHTML=html;const blob=new Blob([html],{type:'text/html'});currentURL=URL.createObjectURL(blob);document.getElementById('frame').src=currentURL;document.getElementById('prev').style.display='block';const dataUrl='data:text/html;charset=utf-8,'+encodeURIComponent(html);document.getElementById('liveLink').href=dataUrl;document.getElementById('liveLink').textContent=dataUrl.slice(0,60)+'... اضغط لفتح في جوجل';document.getElementById('liveLink').setAttribute('data-full',dataUrl);document.getElementById('linkbox').style.display='block';document.getElementById('status').textContent='✅ تم! الموقع شغال ومحفوظ';}
function build(){const idea=document.getElementById('idea').value.trim();if(!idea){alert('اكتب فكرة');return;}document.getElementById('status').textContent='⏳ جاري البناء...';setTimeout(()=>{const html=generateLocalSite(idea);showPreview(html);saveHistory(idea,html);},600);}
function tweakSite(){const t=document.getElementById('tweak').value.trim();if(!t||!currentHTML)return;let html=currentHTML;html=html.replace('</body>',`<div style="padding:16px;background:yellow;border:3px solid #000;margin:16px"><b>تحديث:</b> ${t}</div></body>`);showPreview(html);saveHistory(document.getElementById('idea').value+'+'+t,html);document.getElementById('tweak').value='';}
function setMode(m){const f=document.getElementById('frame');if(m==='mob'){f.style.width='390px';f.style.margin='0 auto';f.style.display='block';document.getElementById('mob').className='on';document.getElementById('dsk').className='';}else{f.style.width='100%';document.getElementById('dsk').className='on';document.getElementById('mob').className='';}}
function copyCode(){navigator.clipboard.writeText(currentHTML);alert('تم نسخ الكود');}
function copyLink(){const url=document.getElementById('liveLink').getAttribute('data-full');navigator.clipboard.writeText(url);alert('تم نسخ الرابط المباشر!');}
function download(){const a=document.createElement('a');a.href=currentURL;a.download='mora-x-site.html';a.click();}
function editCode(){const nc=prompt('عدل الكود:',currentHTML.slice(0,3000));if(nc&&nc.length>100){showPreview(nc);saveHistory('تعديل يدوي',nc);}}
window.onload=()=>{renderHistory();const last=JSON.parse(localStorage.getItem('mora_x_last')||'null');if(last){document.getElementById('idea').value=last.idea;showPreview(last.html);}}
</script>
</body>
</html>
